<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tips Prediction</title>

    <style>

        body{
            font-family:Arial, sans-serif;
            background:#f4f4f4;
        }

        .container{
            width:40%;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }

        input, select{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:12px;
            background:blue;
            color:white;
            border:none;
            cursor:pointer;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Predict Tips</h2>

    <form action="/predict_tips" method="POST">

        <label>Total Bill</label>
        <input type="number" step="any" name="total_bill" required>

        <label>Sex</label>
        <select name="sex">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <label>Smoker</label>
        <select name="smoker">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <label>Day</label>
        <select name="day">
            <option value="Thur">Thur</option>
            <option value="Fri">Fri</option>
            <option value="Sat">Sat</option>
            <option value="Sun">Sun</option>
        </select>

        <label>Time</label>
        <select name="time">
            <option value="Lunch">Lunch</option>
            <option value="Dinner">Dinner</option>
        </select>

        <label>Size</label>
        <input type="number" name="size" required>

        <button type="submit">Predict Tip</button>

    </form>

</div>
<h2>
    The predicted value of the tip is {{result1}}.
</h2>
<a href="/">
            Go to Home page.
        </a>
</body>
</html>
